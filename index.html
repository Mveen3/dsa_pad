<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA PAD</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231a1a1a' stroke='%233b82f6' stroke-width='3'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Consolas,monospace' font-size='24' font-weight='bold' fill='%233b82f6'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
        }

        #editor-container {
            width: 100vw;
            height: calc(100vh - 32px);
        }

        /* Custom Scrollbars */
        .monaco-scrollable-element>.scrollbar {
            background: transparent !important;
        }

        .vs .monaco-scrollable-element>.scrollbar {
            background: transparent !important;
        }

        .monaco-scrollable-element>.scrollbar>.slider {
            background: #555555 !important;
            border-radius: 10px !important;
            transition: background 0.2s ease;
        }

        .monaco-scrollable-element>.scrollbar>.slider:hover,
        .monaco-scrollable-element>.scrollbar>.slider.active {
            background: #777777 !important;
        }

        /* Light mode scrollbar colors */
        .vs .monaco-scrollable-element>.scrollbar>.slider {
            background: #cccccc !important;
        }

        .vs .monaco-scrollable-element>.scrollbar>.slider:hover,
        .vs .monaco-scrollable-element>.scrollbar>.slider.active {
            background: #aaaaaa !important;
        }

        /* Toggle Switch CSS */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #3b82f6;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #3b82f6;
        }

        /* Settings Menu Animations */
        .settings-menu {
            transition: opacity 0.2s, transform 0.2s;
            transform-origin: top right;
        }

        .settings-menu.hidden-panel {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .settings-menu.visible-panel {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <!-- Minimal Header -->
    <header id="app-header"
        class="h-8 bg-[#1a1a1a] border-b border-[#333] flex items-center justify-between px-6 select-none transition-colors duration-200">

        <!-- Left Section: Logo & Title -->
        <div class="flex items-center gap-3">
            <svg id="header-logo" width="16" height="16" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="29" fill="none" stroke="#3b82f6" stroke-width="4" />
                <text x="32" y="41" text-anchor="middle" font-family="Consolas,monospace" font-size="26"
                    font-weight="bold" fill="#3b82f6">&lt;/&gt;</text>
            </svg>
            <h1 id="app-title" class="text-gray-200 font-medium tracking-widest text-xs uppercase">DSA Pad</h1>
        </div>

        <!-- Right Section: Settings Cog -->
        <div class="relative flex items-center">
            <button id="settings-btn"
                class="w-6 h-6 text-xs flex items-center justify-center bg-[#2d2d2d] text-gray-300 rounded-md shadow-sm hover:bg-[#3d3d3d] border border-[#444] transition-colors focus:outline-none"
                title="Settings">
                <i class="fas fa-cog"></i>
            </button>

            <!-- Settings Dropdown Panel -->
            <div id="settings-panel"
                class="settings-menu hidden-panel absolute top-8 right-0 z-[60] w-64 bg-[#252526] rounded-xl shadow-2xl border border-[#444] py-2 mt-2">
                <div class="px-4 py-3 border-b border-[#444] text-gray-200 font-semibold text-sm">
                    Editor Settings
                </div>

                <div class="p-4 flex flex-col gap-4">
                    <!-- Theme Toggle -->
                    <div class="flex items-center justify-between">
                        <span class="text-gray-300 text-sm panel-text">Theme</span>
                        <button id="theme-toggle"
                            class="w-8 h-8 flex items-center justify-center bg-[#333] text-yellow-400 rounded-md hover:bg-[#444] border border-[#555] transition-colors focus:outline-none">
                            <i class="fas fa-sun text-sm"></i>
                        </button>
                    </div>

                    <!-- Language Selector -->
                    <div class="flex items-center justify-between">
                        <span class="text-gray-300 text-sm panel-text">Language</span>
                        <select id="lang-toggle"
                            class="h-8 px-2 bg-[#333] text-gray-300 rounded-md border border-[#555] outline-none cursor-pointer text-sm hover:bg-[#444] transition-colors">
                            <option value="python">Python</option>
                            <option value="cpp">C++</option>
                        </select>
                    </div>

                    <!-- Autocomplete Toggle -->
                    <div class="pt-3 border-t border-[#444] panel-border">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-gray-300 text-sm panel-text">Word Autocomplete</span>
                            <div
                                class="relative inline-block w-10 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" name="toggle" id="autocomplete-toggle" checked
                                    class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out z-10 top-0.5 left-0.5 checked:translate-x-4" />
                                <label for="autocomplete-toggle"
                                    class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                            </div>
                        </div>
                        <div class="text-[11px] text-gray-500">Suggests words already in document</div>
                    </div>

                    <!-- Download Button -->
                    <div class="flex items-center justify-between pt-3 border-t border-[#444] panel-border">
                        <span class="text-gray-300 text-sm panel-text">Download File</span>
                        <button id="download-btn"
                            class="h-8 px-3 bg-blue-600 text-white rounded-md text-sm font-semibold hover:bg-blue-700 transition-colors focus:outline-none shadow-sm flex items-center">
                            <i class="fas fa-download mr-1.5"></i> Save
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Backdrop for closing settings -->
    <div id="settings-backdrop" class="fixed inset-0 z-[55] hidden"></div>

    <div id="editor-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs/loader.js"></script>

    <script>
        const settingsBtn = document.getElementById('settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const settingsBackdrop = document.getElementById('settings-backdrop');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const langToggle = document.getElementById('lang-toggle');
        const autocompleteToggle = document.getElementById('autocomplete-toggle');
        const downloadBtn = document.getElementById('download-btn');

        let isDarkMode = true;
        let isSettingsOpen = false;
        let editorInstance;

        // --- Settings Menu Logic ---
        function toggleSettings() {
            isSettingsOpen = !isSettingsOpen;
            if (isSettingsOpen) {
                settingsPanel.classList.remove('hidden-panel');
                settingsPanel.classList.add('visible-panel');
                settingsBackdrop.classList.remove('hidden');
            } else {
                settingsPanel.classList.add('hidden-panel');
                settingsPanel.classList.remove('visible-panel');
                settingsBackdrop.classList.add('hidden');
            }
        }

        settingsBtn.addEventListener('click', toggleSettings);
        settingsBackdrop.addEventListener('click', toggleSettings);

        // --- Editor Initialization ---
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs' } });

        require(['vs/editor/editor.main'], function () {

            editorInstance = monaco.editor.create(document.getElementById('editor-container'), {
                value: "# cook your dish here\n",

                language: 'python', // Default Language
                theme: 'vs-dark',   // Default Theme
                automaticLayout: true,

                // Typography
                fontSize: 16,
                fontFamily: "'Consolas', 'Courier New', monospace",

                // Minimal Space on the Left
                minimap: { enabled: false },
                lineNumbersMinChars: 3,
                glyphMargin: false,
                folding: true,
                padding: { top: 16, bottom: 16 },

                // Hide the vertical line (overview ruler border) on the right
                overviewRulerBorder: false,
                overviewRulerLanes: 0,
                hideCursorInOverviewRuler: true,

                // Enable Ctrl + Scroll to zoom
                mouseWheelZoom: true,

                // Elegant, thin scrollbars
                scrollbar: {
                    vertical: 'auto',
                    horizontal: 'auto',
                    verticalScrollbarSize: 10,
                    horizontalScrollbarSize: 10,
                    useShadows: true,
                    verticalHasArrows: false,
                    horizontalHasArrows: false
                },

                // Default Autocomplete Settings
                suggest: { showSnippets: false, showClasses: false, showModules: false },
                wordBasedSuggestions: 'currentDocument',
                quickSuggestions: { other: true, comments: false, strings: false }
            });

            // Handle Language Change
            langToggle.addEventListener('change', (e) => {
                monaco.editor.setModelLanguage(editorInstance.getModel(), e.target.value);

                const currentVal = editorInstance.getValue().trim();
                // Update the comment if the editor is empty or still has the default text
                if (currentVal === "" || currentVal === "# cook your dish here" || currentVal === "// cook your dish here") {
                    if (e.target.value === 'cpp') {
                        editorInstance.setValue("// cook your dish here\n");
                    } else {
                        editorInstance.setValue("# cook your dish here\n");
                    }
                }
            });

            // Handle Theme Toggle
            themeToggleBtn.addEventListener('click', () => {
                isDarkMode = !isDarkMode;

                const appHeader = document.getElementById('app-header');
                const appTitle = document.getElementById('app-title');
                const panelHeader = settingsPanel.querySelector('.border-b');
                const panelTexts = document.querySelectorAll('.panel-text');
                const panelBorders = document.querySelectorAll('.panel-border');

                if (isDarkMode) {
                    monaco.editor.setTheme('vs-dark');
                    document.body.style.backgroundColor = '#1e1e1e';

                    // Header Dark
                    appHeader.className = "h-8 bg-[#1a1a1a] border-b border-[#333] flex items-center justify-between px-6 select-none transition-colors duration-200";
                    appTitle.className = "text-gray-200 font-medium tracking-widest text-xs uppercase";
                    settingsBtn.className = "w-6 h-6 text-xs flex items-center justify-center bg-[#2d2d2d] text-gray-300 rounded-md shadow-sm hover:bg-[#3d3d3d] border border-[#444] transition-colors focus:outline-none";

                    // Logo Dark
                    const logo = document.getElementById('header-logo');
                    logo.querySelector('circle').setAttribute('stroke', '#3b82f6');
                    logo.querySelector('text').setAttribute('fill', '#3b82f6');

                    // Panel Dark
                    settingsPanel.className = "settings-menu visible-panel absolute top-8 right-0 z-[60] w-64 bg-[#252526] rounded-xl shadow-2xl border border-[#444] py-2 mt-2";
                    panelHeader.className = "px-4 py-3 border-b border-[#444] text-gray-200 font-semibold text-sm";

                    langToggle.className = "h-8 px-2 bg-[#333] text-gray-300 rounded-md border border-[#555] outline-none cursor-pointer text-sm hover:bg-[#444] transition-colors";

                    themeToggleBtn.innerHTML = '<i class="fas fa-sun text-sm"></i>';
                    themeToggleBtn.className = "w-8 h-8 flex items-center justify-center bg-[#333] text-yellow-400 rounded-md hover:bg-[#444] border border-[#555] transition-colors focus:outline-none";

                    panelTexts.forEach(el => el.className = "text-gray-300 text-sm panel-text");
                    panelBorders.forEach(el => {
                        el.classList.remove('border-gray-200');
                        el.classList.add('border-[#444]');
                    });

                } else {
                    monaco.editor.setTheme('vs');
                    document.body.style.backgroundColor = '#ffffff';

                    // Header Light
                    appHeader.className = "h-8 bg-[#f9fafb] border-b border-gray-200 flex items-center justify-between px-6 select-none transition-colors duration-200";
                    appTitle.className = "text-gray-700 font-medium tracking-widest text-xs uppercase";
                    settingsBtn.className = "w-6 h-6 text-xs flex items-center justify-center bg-white text-gray-700 rounded-md shadow-sm hover:bg-gray-100 border border-gray-300 transition-colors focus:outline-none";

                    // Logo Light
                    const logoL = document.getElementById('header-logo');
                    logoL.querySelector('circle').setAttribute('stroke', '#374151');
                    logoL.querySelector('text').setAttribute('fill', '#374151');

                    // Panel Light
                    settingsPanel.className = "settings-menu visible-panel absolute top-8 right-0 z-[60] w-64 bg-white rounded-xl shadow-2xl border border-gray-200 py-2 mt-2";
                    panelHeader.className = "px-4 py-3 border-b border-gray-200 text-gray-800 font-semibold text-sm";

                    langToggle.className = "h-8 px-2 bg-white text-gray-700 rounded-md border border-gray-300 outline-none cursor-pointer text-sm hover:bg-gray-100 transition-colors";

                    themeToggleBtn.innerHTML = '<i class="fas fa-moon text-sm"></i>';
                    themeToggleBtn.className = "w-8 h-8 flex items-center justify-center bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200 border border-gray-300 transition-colors focus:outline-none";

                    panelTexts.forEach(el => el.className = "text-gray-700 text-sm panel-text");
                    panelBorders.forEach(el => {
                        el.classList.remove('border-[#444]');
                        el.classList.add('border-gray-200');
                    });
                }
            });

            // Handle Autocomplete Toggle
            autocompleteToggle.addEventListener('change', (e) => {
                if (e.target.checked) {
                    editorInstance.updateOptions({
                        wordBasedSuggestions: 'currentDocument',
                        quickSuggestions: { other: true, comments: false, strings: false }
                    });
                } else {
                    editorInstance.updateOptions({
                        wordBasedSuggestions: 'off',
                        quickSuggestions: { other: false, comments: false, strings: false }
                    });
                }
            });

            // Handle Download Code
            downloadBtn.addEventListener('click', () => {
                const code = editorInstance.getValue();
                const lang = langToggle.value;
                const extension = lang === 'python' ? 'py' : 'cpp';
                const filename = `code.${extension}`;

                const blob = new Blob([code], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();

                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                toggleSettings(); // Close menu after saving
            });
        });
    </script>
</body>

</html>
